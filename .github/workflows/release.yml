name: Release

# Push a tag like v1.2.0 to build the Windows and Linux installers and attach them to a
# draft GitHub Release. Review the draft, then publish it; installed apps update from
# published releases automatically.
#
# Don't create the release on GitHub by hand. The draft job creates it once, before the
# builds start, so they never race to create it. Both builds then upload to that draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft release
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published, so the installers can't be attached to it. Delete the release on GitHub (keep the tag), then re-run this workflow."
              exit 1
            fi
            echo "Using the existing draft for $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "Krotala ${TAG#v}" --generate-notes
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assets && npm run check
      - name: Build and upload
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder skips the upload, without failing, when the release was published
  # in the meantime. This makes sure the draft really has every file before you publish it.
  verify:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the draft has the installers and update files
        run: |
          files=$(gh release view "$TAG" --json isDraft,assets --jq 'select(.isDraft) | .assets[].name')
          for pattern in '\.exe$' '\.AppImage$' '^latest\.yml$' '^latest-linux\.yml$'; do
            if ! grep -qE "$pattern" <<< "$files"; then
              echo "::error::The draft release for $TAG has no file matching $pattern. If the release was published before the builds finished, delete it on GitHub (keep the tag) and re-run this workflow."
              exit 1
            fi
          done
          echo "The draft for $TAG has every file. Review it on GitHub, then publish it."
